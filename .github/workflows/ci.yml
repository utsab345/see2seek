name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: lint, format, types, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "open_clip_torch>=2.20.0" "Pillow>=10.0.0" "numpy>=1.24.0" "tqdm>=4.65.0" "PyYAML>=6.0"
          python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format (black)
        run: black --check .

      - name: Types (mypy)
        run: mypy

      - name: Tests (pytest)
        run: pytest